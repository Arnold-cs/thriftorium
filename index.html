<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thriftorium</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="logo">Thriftorium</div>
        <div class="nav-links">
            <a href="#">Browse</a>
            <a href="#">Sell</a>
            <a href="#">Login</a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Buy & Sell Preloved Fashion</h1>
        <p>Give your clothes a second life. Shop sustainably.</p>
        <button class="btn-primary">Start Shopping</button>
    </section>

    <!-- CATEGORY FILTER -->
    <section class="categories">
        <button class="category-btn active">All</button>
        <button class="category-btn">Tops</button>
        <button class="category-btn">Dresses</button>
        <button class="category-btn">Shoes</button>
        <button class="category-btn">Accessories</button>
        <button class="category-btn">Jackets</button>
    </section>

    <!-- PRODUCT GRID -->
    <section class="listings">
        <h2>Recent Listings</h2>
        <div class="product-grid">

            <div class="product-card">
                <img class="product-image" src="https://picsum.photos/seed/jacket/400/300" alt="Denim Jacket" />
                <div class="product-info">
                    <p class="product-title">Denim Jacket</p>
                    <p class="product-seller">by @nomsa_thrifts</p>
                    <p class="product-price">R250</p>
                </div>
            </div>

            <div class="product-card">
                <img class="product-image" src="https://picsum.photos/seed/sneakers/400/300" alt="White Sneakers" />
                <div class="product-info">
                    <p class="product-title">White Sneakers</p>
                    <p class="product-seller">by @kicks_za</p>
                    <p class="product-price">R180</p>
                </div>
            </div>

            <div class="product-card">
                <img class="product-image" src="https://picsum.photos/seed/dress/400/300" alt="Floral Dress" />
                <div class="product-info">
                    <p class="product-title">Floral Dress</p>
                    <p class="product-seller">by @zintle_closet</p>
                    <p class="product-price">R120</p>
                </div>
            </div>

            <div class="product-card">
                <img class="product-image" src="https://picsum.photos/seed/belt/400/300" alt="Leather Belt" />
                <div class="product-info">
                    <p class="product-title">Leather Belt</p>
                    <p class="product-seller">by @style_swap</p>
                    <p class="product-price">R80</p>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
